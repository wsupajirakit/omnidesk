# [LOCAL-MIRROR] nginx serving the built SPA — same role as the FE container in prod.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ==== [FIX-20260830-STALEBUNDLE] ====================================
  # Everything under /assets/ carries a content hash in its filename, so a name
  # that is not on disk is a STALE REFERENCE, never a route. It must 404.
  #
  # WHY: with only the catch-all below, a missing chunk fell through to
  # `/index.html` and answered **200 with text/html** — JavaScript was handed a
  # web page. Verified 30/08: `GET /assets/TicketChat-CQk6ecOZ.js` (a chunk
  # deleted weeks earlier) returned 200. A browser holding an old index.html
  # therefore failed in a way that looks like a code bug rather than a stale
  # bundle, and a whole afternoon went into chasing one.
  location /assets/ {
    try_files $uri =404;
  }

  # index.html is the ONLY unhashed file, and it is the map to every chunk name.
  # Cached, it pins the browser to a build that no longer exists on the server.
  # Sent with nothing but ETag/Last-Modified, a browser may reuse it without
  # revalidating — so say no-store outright. The hashed files it points at are
  # still cacheable as normal; this costs one conditional request per load.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }
  # ==== [FIX-20260830-STALEBUNDLE] END ================================

  # SPA fallback: any unknown path returns index.html (client-side routing)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
