server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ==== [FIX-20260818-FEHEADERS] START — security headers (plan §2.4 B4 = T1-5)
  #
  # อะไร: ก่อนหน้านี้ไฟล์นี้มี `add_header` แค่ 3 บรรทัด และทั้งหมดเป็น Cache-Control
  #       ⇒ dashboard ตอบทุก response โดยไม่มี security header เลยสักตัว
  #
  # ⚠️ X-Frame-Options ต้องเป็น SAMEORIGIN ไม่ใช่ DENY — ตรวจของจริงแล้ว ไม่ได้เดา:
  #   `pages/hook/Simulator.tsx:7` ฝัง <iframe src="sim/Bot%20Message%20Editor.html">
  #   และไฟล์นั้น **ไม่มีอยู่จริงทั้ง repo** (หา public/ และ dist/ แล้ว) ⇒ คำขอตกไปที่
  #   `location /` → `try_files $uri /index.html` → ได้ index.html กลับมาใน iframe
  #   แปลว่าหน้านี้ frame ตัวเอง (same-origin) อยู่ทุกวันนี้ · ใส่ DENY = หน้าขาวทันที
  #   SAMEORIGIN กันการถูก frame จากโดเมนอื่นได้เท่ากัน โดยไม่พังหน้านี้
  #
  # ⚠️ ทำไมต้องประกาศซ้ำใน location: nginx สืบทอด `add_header` ลง location
  #   **เฉพาะเมื่อ location นั้นไม่มี add_header ของตัวเอง** ⇒ `location /` (ไม่มี)
  #   ได้จาก server อัตโนมัติ แต่ `/assets/` และ `= /index.html` มีของตัวเองอยู่แล้ว
  #   จึงต้องเขียนซ้ำ ไม่งั้นสองเส้นนั้นจะไม่มี header ทั้งที่ตั้งไว้ที่ server
  #
  # ยังไม่ใส่ CSP รอบนี้ — ต้องเริ่มจาก Report-Only แล้วเก็บ report ก่อน (T3-5)
  #
  # revert: ลบ 3 บรรทัดในบล็อกนี้ และที่ซ้ำอยู่ในสอง location ด้านล่าง
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # ==== [FIX-20260818-FEHEADERS] END

  # ==== [FIX-20260729-SPACACHE] START — 🔒 สาย AUTO (to_dev_auto / to_prod_auto)
  #
  # อาการ: หน้า Dynamic Tag พัง —
  #   TypeError: Failed to fetch dynamically imported module:
  #   .../assets/DynamicTagList-4RTwF4_7.js
  #
  # สาเหตุ (ตรวจกับ prod จริง ไม่ได้เดา):
  #   - ไฟล์ chunk บนเซิร์ฟเวอร์ **มีครบ** (ตัวใหม่ CfR8BC1q ตอบ 200)
  #   - แต่ `index.html` เดิม **ไม่มี Cache-Control เลย** → เบราว์เซอร์ใช้ heuristic
  #     cache เก็บ index.html เก่าไว้ พอ deploy รอบใหม่ ผู้ใช้ยังรัน
  #     index-B6u-oUHh.js ตัวเก่าที่อ้าง chunk ชื่อ hash เก่า ซึ่งถูกลบไปแล้ว
  #     → lazy import พังทั้งหน้า จนกว่าจะ hard refresh
  #
  # กติกามาตรฐานของ SPA ที่ตั้งชื่อไฟล์ด้วย hash (vite ทำให้อยู่แล้ว):
  #   index.html            → ห้าม cache เด็ดขาด (ต้องได้ตัวล่าสุดทุกครั้ง)
  #   /assets/*.[hash].js   → cache ยาวได้ ปลอดภัย เพราะเปลี่ยนเนื้อหา = เปลี่ยนชื่อ
  #
  # revert: ลบทุกอย่างระหว่าง START/END แล้วเหลือ location / { try_files ... } อันเดียว

  # assets มี hash ในชื่อไฟล์ → immutable ได้เต็มที่ ไม่ต้องถาม server ซ้ำ
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # [FIX-20260818-FEHEADERS] ซ้ำจาก server เพราะ block นี้มี add_header ของตัวเอง
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location / {
    # ไม่มี add_header ของตัวเอง ⇒ สืบทอด 3 ตัวจาก server โดยอัตโนมัติ
    try_files $uri /index.html;
  }

  # ต้องอยู่หลัง location / เพื่อ override เฉพาะตัว index.html
  # (ทั้งที่ขอตรง ๆ และที่มาจาก try_files fallback)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
    # [FIX-20260818-FEHEADERS] ซ้ำด้วยเหตุผลเดียวกับ /assets/ ด้านบน
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  # ==== [FIX-20260729-SPACACHE] END
}
